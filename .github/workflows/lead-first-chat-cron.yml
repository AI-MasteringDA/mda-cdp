name: Lead first-chat sync (Ngày chat đầu + Hot Score)

on:
  schedule:
    # 4 lần/ngày (đổi từ hourly 2026-08-15 — Supabase project bị khoá vì vượt
    # egress quota: job này full-scan ~19k dòng dim_lead MỖI LẦN chạy, hourly =
    # ~5.5GB/tháng chỉ riêng job này). Report Lark chỉ bắn 2 lần/ngày (10:30 &
    # 17:00 VN) nên không cần tươi theo giờ — canh chạy ngay TRƯỚC mỗi giờ bắn
    # report để data luôn mới lúc chụp, cộng 2 lần rải rác giữ ID/tag không kẹt
    # quá lâu ngoài giờ report:
    #   02:45 UTC = 09:45 VN (45' trước report Sáng 10:30)
    #   08:45 UTC = 15:45 VN (75' trước report Chiều 17:00)
    #   14:45 UTC = 21:45 VN · 20:45 UTC = 03:45 VN (rải rác qua đêm)
    - cron: '45 2,8,14,20 * * *'
  workflow_dispatch:

concurrency:
  group: lead-first-chat
  cancel-in-progress: false

jobs:
  lead-first-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Sync first-chat date
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
          SMAX_USER_TOKEN: ${{ secrets.SMAX_USER_TOKEN }}
          SMAX_API_KEY: ${{ secrets.SMAX_API_KEY }}
          SMAX_BASE_URL: https://api.smax.ai
        run: npm run etl:lead:firstchat
      - name: Build Daily_Report (nguồn cho Lark Dashboard)
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
        run: npm run etl:daily:report
