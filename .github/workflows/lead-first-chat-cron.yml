name: Lead first-chat sync (Ngày chat đầu + Hot Score)

on:
  schedule:
    # MỖI GIỜ — điền "Ngày chat đầu"/"Báo cáo ngày"/"Ngày check" + Hot Score lên
    # SMAX_Database. Chạy dày để lead MỚI trong ngày có ngày ngay (không phải chờ
    # tới hôm sau → tránh count bị thiếu như ca Vương Thanh/lead cold hôm nay).
    - cron: '32 * * * *'
  workflow_dispatch:

concurrency:
  group: lead-first-chat
  cancel-in-progress: false

jobs:
  lead-first-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Sync first-chat date
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
          SMAX_USER_TOKEN: ${{ secrets.SMAX_USER_TOKEN }}
          SMAX_API_KEY: ${{ secrets.SMAX_API_KEY }}
          SMAX_BASE_URL: https://api.smax.ai
        run: npm run etl:lead:firstchat
      - name: Build Daily_Report (nguồn cho Lark Dashboard)
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
        run: npm run etl:daily:report
