name: Radar dashboard snapshot → gửi Lark group

on:
  schedule:
    # 10:30 sáng giờ VN (UTC+7) = 03:30 UTC — đợt Sáng: 17:00 hôm qua→10:30 hôm nay
    - cron: '30 3 * * *'
    # 17:00 chiều giờ VN = 10:00 UTC — đợt Chiều: 10:30→17:00 hôm nay + tổng quan 30 ngày
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      run:
        description: "Ép đợt (bỏ trống = tự đoán theo giờ chạy)"
        type: choice
        options: ["", "am", "pm"]
        default: ""

concurrency:
  group: radar-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Xác định đợt (Sáng/Chiều) theo lịch cron vừa kích hoạt
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "30 3 * * *") echo "run=am" >> "$GITHUB_OUTPUT" ;;
            "0 10 * * *") echo "run=pm" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=${{ github.event.inputs.run }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Chụp dashboard + gửi vào group Lark
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          RADAR_SNAPSHOT_KEY: ${{ secrets.RADAR_SNAPSHOT_KEY }}
          RADAR_DASHBOARD_URL: https://mda-cdp.vercel.app
          LARK_DAILY_WEBHOOK: ${{ secrets.LARK_DAILY_WEBHOOK }}
          RADAR_RUN: ${{ steps.pick.outputs.run }}
        run: npm run etl:radar:snapshot
