name: Radar dashboard snapshot → gửi Lark group

on:
  schedule:
    # 10:00 sáng giờ VN (UTC+7) = 03:00 UTC.
    # MỘT ĐỢT MỖI NGÀY, số của NGUYÊN NGÀY HÔM QUA (user chốt 2026-09-07).
    # Trước đây 2 đợt Sáng/Chiều cắt theo giờ (17:00→10:30 và 10:30→17:00) làm
    # một người "vào" và "lên Hot" rơi vào hai đợt khác nhau, số nhìn khó hiểu.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run:
        # KHÔNG còn dùng. Giữ lại để lời gọi cũ từ cron-job.org (có kèm
        # inputs.run=am|pm) không bị GitHub trả lỗi 422 "Unexpected inputs".
        description: "(bỏ trống — không còn tác dụng)"
        required: false
        default: ""

concurrency:
  group: radar-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 15' vì có thêm bước tính bảng so sánh khoá (~2,5 phút) trước khi chụp.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      # Tính bảng so sánh khoá NGAY TRƯỚC khi chụp, để thẻ "Khoá … so với các
      # khoá trước" luôn phản ánh số mới nhất. Quét mất ~2,5 phút nên không thể
      # tính lúc mở trang (Vercel cắt hàm ở 60s) — xem etl/sources/cohort-build.ts.
      # Lỗi ở bước này KHÔNG được chặn việc gửi báo cáo: thẻ khoá sẽ hiện số của
      # lần tính trước, còn hơn mất cả 5 thẻ.
      - name: Tính bảng so sánh khoá (Cohort_Summary)
        continue-on-error: true
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
        run: npm run etl:cohort:build
      - name: Chụp dashboard + gửi vào group Lark
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          RADAR_SNAPSHOT_KEY: ${{ secrets.RADAR_SNAPSHOT_KEY }}
          RADAR_DASHBOARD_URL: https://mda-cdp.vercel.app
          LARK_DAILY_WEBHOOK: ${{ secrets.LARK_DAILY_WEBHOOK }}
          # ═══ TẠM DỪNG GỬI VÀO GROUP (2026-09-07) ═══
          # User: "khoan hãy bắn, chúng ta cần xem kỹ lại trước khi bắn
          # production, còn chỉnh nhiều visuals lắm".
          # Vẫn chạy trọn luồng mỗi ngày (mở trang, bấm lọc, chụp, upload) để
          # biết pipeline còn sống, chỉ KHÔNG gửi tin vào group.
          # MỞ LẠI: xoá đúng dòng dưới đây.
          RADAR_DRY_RUN: '1'
        run: npm run etl:radar:snapshot
