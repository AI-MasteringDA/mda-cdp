name: SMAX→Lark trực tiếp (không qua Supabase)

# Đọc Lark làm bản đồ danh tính + gọi SMAX API → ghi thẳng lên Lark. KHÔNG đụng
# Supabase, nên vẫn chạy khi Supabase bị khoá/hỏng.
# Khi pipeline đầy đủ (smax-cron + lead-first-chat-cron) chạy lại được thì job
# này thành DƯ THỪA cho các cột nó phụ trách — cân nhắc tắt để đỡ tốn API call.
# Chi tiết + giới hạn: etl/sources/smax-lark-bridge.ts

on:
  schedule:
    # Mỗi 7 phút, chỉ trong giờ làm việc 8AM-6PM VN (1-10 UTC) — cùng khung với
    # smax-cron/lark-push-smax-cron đang tạm nghỉ vì bị khoá.
    - cron: '*/7 1-10 * * *'
  workflow_dispatch:

concurrency:
  group: smax-lark-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Đẩy SMAX → Lark (không qua Supabase)
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_APP_TOKEN: ${{ secrets.LARK_BASE_APP_TOKEN }}
          SMAX_USER_TOKEN: ${{ secrets.SMAX_USER_TOKEN }}
          SMAX_API_KEY: ${{ secrets.SMAX_API_KEY }}
          SMAX_BASE_URL: https://api.smax.ai
        run: npm run etl:smax:lark:bridge
